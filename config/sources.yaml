# Sabra Job Engine — discovery source registry (requirement 7)
#
# Every entry below was verified live against the source's public API before it
# was added; `verified_jobs` is the posting count observed on `verified_at`.
# A board that stops publishing shows up as a stale verification rather than as
# an unexplained drop in results.
#
# `domain` is the employer's own site. It is optional: it is only recorded here
# when the domain was confirmed to resolve.
#
# Supported kinds: GREENHOUSE, LEVER, ASHBY (public job-board JSON APIs) and
# DIRECT_CAREERS (schema.org JobPosting JSON-LD on a company page). A role on an
# ASHBY or DIRECT_CAREERS board cannot be filled by the engine: once approved it
# opens in your browser for you to complete (see docs/operations/windows-pilot.md).
#
# Optional per-entry keys: `max_items` caps the postings read from one board.
# `sabra sources add <careers-url>` appends an entry for you and keeps these comments.
#
# Tier 1 (requirement 7) is Greenhouse + Lever + directly accessible company
# career pages. See `docs/operations/source-registry-findings.md` for why no
# DIRECT_CAREERS entry is enabled: every seed-vertical employer's careers page
# routes to one of the ATS boards below, and none publishes capturable
# schema.org JobPosting JSON-LD, so a DIRECT_CAREERS entry would contribute
# nothing. The provider is implemented and covered by tests in case that changes.

version: 1
