<!doctype html>
<html>
<head><title>Apply for Regional Sales Manager at Example Health</title></head>
<body>
<form>
  <label for="name">Full name</label><input id="name" name="name" required>
  <label for="email">Email</label><input id="email" name="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel" required>
  <label for="org">Current company</label><input id="org" name="org">
  <label for="resume">Resume</label><input id="resume" name="resume" type="file" required>
  <label for="comments">Additional information</label><textarea id="comments" name="comments"></textarea>
  <label for="cards-q1">Are you legally authorized to work in the United States?</label>
  <input id="cards-q1" name="cards[q1][field0]" required>
  <label for="cards-q2">What is your desired salary?</label>
  <input id="cards-q2" name="cards[q2][field0]" required>
  <label for="cards-q3">Describe a certification you do not have.</label>
  <input id="cards-q3" name="cards[q3][field0]" required>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
