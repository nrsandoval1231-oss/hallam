<!doctype html>
<html>
<head><title>Job Application for Regional Sales Manager at Example Health</title></head>
<body>
<form>
  <label for="first_name">First Name</label><input id="first_name" required>
  <label for="last_name">Last Name</label><input id="last_name" required>
  <label for="email">Email</label><input id="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" type="tel" required>
  <label for="country">Country</label><input id="country" required>
  <label for="resume">Resume</label><input id="resume" type="file">
  <label for="company-name-0">Company name</label><input id="company-name-0" required>
  <label for="title-0">Title</label><input id="title-0" required>
  <label for="start-date-month-0">Start date month</label><input id="start-date-month-0" required>
  <label for="start-date-year-0">Start date year</label><input id="start-date-year-0" required>
  <label for="end-date-month-0">End date month</label><input id="end-date-month-0" required>
  <label for="end-date-year-0">End date year</label><input id="end-date-year-0" required>
  <label for="current-role-0_1">Current role</label><input id="current-role-0_1" type="checkbox">
  <label for="school--0">School</label><input id="school--0">
  <label for="degree--0">Degree</label><input id="degree--0">
  <label for="discipline--0">Discipline</label><input id="discipline--0">
  <label for="start-year--0">Start date year</label><input id="start-year--0">
  <label for="end-year--0">End date year</label><input id="end-year--0">
  <label for="question_auth">Are you legally authorized to work in the United States?</label>
  <input id="question_auth" required>
  <label for="question_salary">What are your salary expectations?</label>
  <input id="question_salary" required>
  <label for="question_unknown">Have you signed a non-compete with your current employer?</label>
  <input id="question_unknown" required>
  <button type="submit">Submit application</button>
</form>
</body>
</html>
